name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-tests:
    name: Backend Tests (PHPUnit)
    runs-on: ubuntu-latest
    env:
      # Muss mit phpunit.xml.dist übereinstimmen; Doctrine hängt im
      # test-Environment den Suffix "_test" an (dbname_suffix).
      DATABASE_URL: "mysql://root:@127.0.0.1:3306/test_blog"
      # Echte Umgebungsvariablen haben Vorrang vor .env-Dateien:
      # kein SMTP im CI, deterministische Werte
      MAILER_DSN: "null://null"
      CONTACT_FROM_EMAIL: "noreply@example.de"
      CONTACT_TO_EMAIL: "info@example.de"
      LOCK_DSN: "flock"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: test_blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo_mysql, mbstring, xml, curl, zip, intl, gd, fileinfo
        coverage: none

    - name: Install Composer dependencies
      # --no-scripts: symfony/flex würde cache:clear/assets:install ausführen
      # und ohne committete .env fatal scheitern (APP_SECRET fehlt).
      run: composer install --no-progress --prefer-dist --no-interaction --no-scripts

    - name: Generate JWT keypair (test)
      env:
        JWT_PASSPHRASE: ci-test-passphrase
      run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test

    - name: Create test database
      run: php bin/console doctrine:database:create --if-not-exists --env=test

    - name: Create database schema
      run: php bin/console doctrine:schema:create --env=test

    - name: Run PHPUnit tests
      run: vendor/bin/phpunit --testdox

  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      working-directory: public/frontend
      run: npm install

    - name: Lint code
      working-directory: public/frontend
      run: npm run lint || echo "Linting failed or not configured"

    - name: Build frontend
      working-directory: public/frontend
      run: npm run build

    - name: Run tests
      working-directory: public/frontend
      run: npm test || echo "Tests failed or not configured"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: public/frontend/dist/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-and-build, php-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push frontend image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/blog-frontend:latest

    - name: Build frontend image (PR)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/frontend/Dockerfile
        push: false
        tags: blog-frontend:pr-${{ github.event.number }}